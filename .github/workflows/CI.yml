name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: 'ubuntu-24.04'

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Check formatting
        run: pnpm run format:check
      - name: Build
        run: pnpm run build:all
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm run test
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test extension in Chrome and Electron
        uses: coactions/setup-xvfb@v1
        with:
          run: pnpm --filter remotedev-redux-devtools-extension run test:chrome && pnpm --filter remotedev-redux-devtools-extension run test:electron
